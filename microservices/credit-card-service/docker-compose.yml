version: '3.8'

services:
  credit-card-authorizer:
    # Build from the local directory
    build:
      context: ../../../../../../Downloads/assignment3credit-card-authorizer-main
      dockerfile: Dockerfile

    # Container name for clarity
    container_name: credit-card-authorizer-container

    # Port mapping: host:container
    ports:
      - "8082:8082"

    # Environment variables
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m

    # Health check to verify container is responding
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/credit-card-authorizer/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy: restart automatically unless stopped manually
    restart: unless-stopped

    # Optional: resource constraints (works in Swarm or Compose v3+)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
