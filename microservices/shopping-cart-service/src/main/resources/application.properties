spring.application.name=shopping-cart-service
server.port=8084
database.url=${DATABASE_URL:http://localhost:9080}
# Read strategy: R5 (strong consistency, all nodes) for write-heavy Shopping Cart Service
# R5 ensures strong consistency for cart operations where accuracy > speed
# Critical for checkout to prevent showing stale cart data or incorrect totals
database.readStrategy=${DATABASE_READ_STRATEGY:R5}
credit.card.authorizer.url=${CREDIT_CARD_AUTHORIZER_URL:http://localhost:8082/credit-card-authorizer/authorize}
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
warehouse.service.url=${WAREHOUSE_SERVICE_URL:http://localhost:8081}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}