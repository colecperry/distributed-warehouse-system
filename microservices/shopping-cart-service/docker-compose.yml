version: '3.8'

services:
  shopping-cart-service:
    build:
      context: ../../../../../../Downloads/assignment3shopping-cart-service-main
      dockerfile: Dockerfile
    container_name: shopping-cart-service-container
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
    #depends_on:
    #  - credit-card-authorizer
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

