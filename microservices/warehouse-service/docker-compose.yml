version: '3.8'

services:
  warehouse-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: warehouse-service-container

    # Map the port (host -> container)
    # Change left side if you want a different local port
    ports:
      - "8089:8089"

    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
