database.url=${DATABASE_URL:http://localhost:9080}
# Read strategy: R1 (fast, single node) for read-heavy Product Service
# R1 is optimized for product browsing where speed > strict consistency
database.readStrategy=${DATABASE_READ_STRATEGY:R1}
server.port=8083
logging.level.com.cs6650.productservice=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
spring.application.name=product-service
