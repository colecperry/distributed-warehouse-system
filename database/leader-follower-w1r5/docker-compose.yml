version: '3.8'

services:
  # ===================================================
  # LEADER NODE
  # ===================================================
  w1r5-leader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: w1r5-leader

    ports:
      - "8080:8080"

    environment:
      - PORT=8080
      - NODE_ID=1
      - NODE_TYPE=leader

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/leader/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # ===================================================
  # FOLLOWER 1
  # ===================================================
  w1r5-follower1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: w1r5-follower1

    ports:
      - "8081:8081"

    environment:
      - PORT=8081
      - NODE_ID=2
      - NODE_TYPE=follower

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/follower/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    depends_on:
      - w1r5-leader

  # ===================================================
  # FOLLOWER 2
  # ===================================================
  w1r5-follower2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: w1r5-follower2

    ports:
      - "8082:8082"

    environment:
      - PORT=8082
      - NODE_ID=3
      - NODE_TYPE=follower

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/follower/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    depends_on:
      - w1r5-leader

  # ===================================================
  # FOLLOWER 3
  # ===================================================
  w1r5-follower3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: w1r5-follower3

    ports:
      - "8083:8083"

    environment:
      - PORT=8083
      - NODE_ID=4
      - NODE_TYPE=follower

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/follower/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    depends_on:
      - w1r5-leader

  # ===================================================
  # FOLLOWER 4
  # ===================================================
  w1r5-follower4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: w1r5-follower4

    ports:
      - "8084:8084"

