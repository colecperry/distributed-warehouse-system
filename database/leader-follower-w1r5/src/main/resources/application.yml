# Server configuration
server:
  port: ${PORT:8080}

# Node configuration (reads from environment variables)
node:
  id: ${NODE_ID:1}
  type: ${NODE_TYPE:leader}

  # Node URLs - use Docker service names
  nodes:
    - http://w1r5-leader:8080
    - http://w1r5-follower1:8081
    - http://w1r5-follower2:8082
    - http://w1r5-follower3:8083
    - http://w1r5-follower4:8084