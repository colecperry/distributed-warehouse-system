# Server configuration
server:
  port: ${PORT:8080}

# Node configuration (reads from environment variables)
node:
  id: ${NODE_ID:1}
  type: ${NODE_TYPE:leader}

  # Using new Docker service names and port range 9080-9084
  nodes:
    - http://w1r5-leader:9080
    - http://w1r5-follower1:9081
    - http://w1r5-follower2:9082
    - http://w1r5-follower3:9083
    - http://w1r5-follower4:9084